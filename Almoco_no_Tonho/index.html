<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almoço no Tonho</title>
<style>
:root{--bg:#f5f3f2;--cd:#fff;--tx:#1f1b18;--mu:#7b726b;--ac:#ea1d2c;--bd:#e8e2de;--ok:#1b8a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141110;--cd:#221e1c;--tx:#f3edea;--mu:#a99f98;--bd:#38322f;--ok:#5fd38d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141110;--cd:#221e1c;--tx:#f3edea;--mu:#a99f98;--bd:#38322f;--ok:#5fd38d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:680px;margin:0 auto}
header{background:var(--ac);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:1.15rem}header button{background:#0003;color:#fff;border:0}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd)}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);border-radius:20px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
h2{font-size:1.1rem;margin:18px 14px 6px}
.dish{display:flex;gap:12px;align-items:center;background:var(--cd);border-bottom:1px solid var(--bd);padding:14px}
.dish .t{flex:1;min-width:0}.dish .n{font-weight:600}.mu{color:var(--mu);font-size:.9rem}
.pr{font-weight:600;margin-top:4px}
.ph{width:84px;height:84px;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(135deg,#ffb199,#ea1d2c33);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;flex:0 0 auto}
.ph .im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:inherit;display:block;background:var(--bd)}
.ph.nf{opacity:.95}.ph.nf span{opacity:.45;filter:grayscale(1)}
@media (min-width:600px){.ph{width:104px;height:104px}}
.add{position:absolute;right:-6px;bottom:-6px;background:var(--cd);color:var(--ac);border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;font-size:1.3rem;cursor:pointer;box-shadow:0 1px 4px #0003}
.qs{position:absolute;right:-6px;bottom:-8px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;display:flex;align-items:center;gap:8px;padding:2px 8px;box-shadow:0 1px 4px #0003;font-weight:700}
.qs button{border:0;background:none;color:var(--ac);font-size:1.2rem;padding:0 2px;cursor:pointer}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
input,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:9}
.bar button{width:100%;display:flex;justify-content:space-between;padding:14px 18px;max-width:656px;margin:0 auto}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:680px;margin:0 auto;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.err{color:var(--ac);font-weight:600}.ok{color:var(--ok);font-weight:600}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font:.85rem/1.4 ui-monospace,monospace}
</style></head><body><main id="app"><p class="mu" style="padding:16px">Carregando…</p></main>
<script>
const MENU=[
["🍢","Petiscos",[["p1","Pão de alho recheado","Baguete com creme de alho e recheio à escolha. A partir de",45],["p2","Vaca Desatolada","Costela bovina desfiada e refogada (100g), aipim frito (150g)",59],["p3","Barrigada","Barriga suína marinada no limão com especiarias, frita",59],["p4","Feijão Amigo","Caldinho de feijoada (copo americano 200ml)",19],["p5","Provoleta","Provolone gratinado com orégano (250g), manjericão e tomate grelhado",49]]],
["🍟","Porções",[["o1","Alcatra Cream Cheese","Quatro queijos! 250g de alcatra em cubos, refogado na manteiga com alho",75],["o2","Mix Raiz","Aipim, batata rústica, batata palito, torresmo, bacon",65],["o3","Camarão à Milanesa","Camarão grande (250g) empanado no Panko",125],["o4","Isca de Peixe","Pescada amarela à milanesa, empanada no Panko (300g)",79],["o5","Isca de Frango","Peito de frango à milanesa (300g), empanado com flocos de milho",49],["o6","Porções Tradicionais","Batata frita, rústica ou aipim frito (300g) + barbecue de goiabada. A partir de",23]]],
["🧆","Bolinhos",[["b1","O cupim do boi de mamão","Bolinho de cupim marinado no vinho. Petisco do Comida di Buteco 2024",59],["b2","Suvaco de Sabugo (6 un)","Bolinho de milho verde com parmesão, empanado",47],["b3","Zé Pequeno (6 un)","Dadinho de tapioca com queijo minas e castanha do Pará",44],["b4","Colono (6 un)","Bolinho de linguiça colonial e queijo, vinagrete de abacaxi",39],["b5","Siri (6 un)","Bolinho de siri empanado no panko, maionese de limão siciliano",49]]],
["🍗","Coxinhas",[["c1","Coxinha de Costela (un)","Costela assada, desfiada, com massa artesanal. Campeã Comida di Buteco 2018",23],["c2","Coxinha de Queijo (un)","Muçarela e provolone, massa artesanal de aipim (150g)",18]]],
["🥟","Pastéis",[["t1","Pastel de Camarão","Molho vermelho com requeijão, vinagrete de abacaxi",42],["t2","Pastel Costela e Queijo","Costela assada, desfiada e refogada, muçarela e provolone",36],["t3","Pastel Muçarela c/ Parmesão","Muçarela e provolone, vinagrete de abacaxi",27],["t4","Vento Sul (4 pastéis)","4 pastéis recheados de vento, com barbecue de goiabada",15]]],
["🍛","Pratos Individuais",[["i1","Camarão com Abacaxi","Camarão, alho poró, tomate, cebola, leite de coco, requeijão, açafrão, abacaxi",138],["i2","Baião de Dois","Feijão vermelho, arroz, charque, calabresa, bacon, queijo, cebola, couve, vinagrete",87],["i3","Peixe à Milanesa","Filé de peixe à milanesa, arroz com legumes, lascas de coco e batata frita",109],["i4","Bife a Cavalo","Alcatra acebolada, ovo frito, queijo gratinado, batata rústica, arroz com crispe",94],["i5","Frango Parmegiana","Peito de frango recheado com presunto e queijo, molho de tomate, arroz e batata",79]]],
["🍽️","Pratos para 2",[["d1","Peixe ao Molho de Camarão (R$ 165)","Peixe à milanesa com molho de camarão e champignon, arroz com lascas de coco",165],["d2","Costela Assada","Costela bovina assada por 6h (aprox. 600g), arroz e legumes",208],["d3","Peixe ao Molho de Camarão (R$ 239)","Peixe à milanesa com molho de camarão e champignon, arroz com lascas de coco",239],["d4","Parmegiana de Frango Recheado","Peito de frango com presunto e queijo ao molho de tomate, arroz, legumes",149],["d5","Peixe Assado","Tainha assada (~700g) com mix de legumes à grega, arroz, batata",230],["d6","Camarão à Grega","Camarão à milanesa no Panko (250g), arroz à grega, aipim frito e legumes",215]]]];
const IT={};MENU.forEach(([e,c,l])=>l.forEach(([id,n,d,p])=>IT[id]={n,p}));
// FOTOS: id do prato -> caminho/URL da fotografia real (quadrada, ideal 400x400, .jpg/.webp).
// Fotos extraídas do cardápio oficial (Goomer). null = ainda sem foto: o app mostra o espaço reservado. Preencha só com fotos oficiais/autorizadas.
const FOTOS={
  p1:"img/p1.jpg",
  p2:"img/p2.jpg",
  p3:"img/p3.jpg",
  p4:"img/p4.jpg",
  p5:"img/p5.jpg",
  o1:"img/o1.jpg",
  o2:"img/o2.jpg",
  o3:"img/o3.jpg",
  o4:"img/o4.jpg",
  o5:"img/o5.jpg",
  o6:"img/o6.jpg",
  b1:"img/b1.jpg",
  b2:"img/b2.jpg",
  b3:"img/b3.jpg",
  b4:"img/b4.jpg",
  b5:"img/b5.jpg",
  c1:"img/c1.jpg",
  c2:"img/c2.jpg",
  t1:"img/t1.jpg",
  t2:"img/t2.jpg",
  t3:"img/t3.jpg",
  t4:"img/t4.jpg",
  i1:"img/i1.jpg",
  i2:"img/i2.jpg",
  i3:"img/i3.jpg",
  i4:null,
  i5:null,
  d1:"img/d1.jpg",
  d2:"img/d2.jpg",
  d3:"img/d3.jpg",
  d4:"img/d4.jpg",
  d5:"img/d5.jpg",
  d6:"img/d6.jpg"
};
const semFoto=Object.keys(IT).filter(i=>!FOTOS[i]);if(semFoto.length)console.info('Pratos sem foto ('+semFoto.length+'):',semFoto.map(i=>i+' '+IT[i].n).join(' | '));
const ph=(id,nm)=>FOTOS[id]?`<img class="im" src="${esc(FOTOS[id])}" alt="${esc(nm)}" width="104" height="104" loading="lazy" decoding="async" onerror="this.style.display='none'">`:'';
const $=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>'R$ '+v.toFixed(2).replace('.',','),slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
let db,user,isOwner=false,S={sess:null,tab:'p',err:'',cat:0,cart:{},shared:[],jd:null,grp:false,title:'',members:[''],note:'',sheet:false,saved:false,orders:[]};
const tot=it=>Object.entries(it||{}).reduce((s,[i,q])=>s+(IT[i]?IT[i].p*q:0),0),cnt=it=>Object.values(it||{}).reduce((s,q)=>s+q,0);
const heads=x=>x.mode=='grp'?Math.max(1,(x.members||[]).filter(m=>m.trim()).length):1;
function save(){try{sessionStorage.setItem('s',JSON.stringify(S.sess))}catch(e){}}
function render(){
 if(!db){$.innerHTML='<div class="box"><b>Acesso necessário</b><p>Abra o link pelo Claude, logado, com permissão de colaborador concedida pelo organizador.</p></div>';return}
 if(!S.sess){$.innerHTML=`<header><b>🍽️ Almoço no Tonho</b></header><div class="box"><div class="row" style="justify-content:flex-start"><button class="chip ${S.tab=='p'?'on':''}" data-a="tab" data-v="p">Participante</button><button class="chip ${S.tab=='a'?'on':''}" data-a="tab" data-v="a">Administrador</button></div>
 ${S.tab=='p'?'<p class="mu">Primeiro acesso? Digite seu nome e crie uma senha. Nas próximas vezes, use a mesma.</p><input id="nm" placeholder="Seu nome" autocomplete="username">':'<p class="mu">Acesso do organizador. Na primeira vez, a senha digitada vira a senha de administrador.</p>'}
 <input id="pw" type="password" placeholder="Senha (mín. 4 caracteres)" autocomplete="current-password"><p class="err">${esc(S.err)}</p><button class="p" style="width:100%" data-a="login">Entrar</button></div>`;return}
 $.innerHTML=`<header><b>🍽️ ${S.sess.role=='a'?'Painel do administrador':'Olá, '+esc(S.sess.name)}</b><button data-a="out">Sair</button></header>`+(S.sess.role=='a'?admin():shop());
}
function shop(){
 const n=cnt(S.cart);let h=`<div class="chips">${MENU.map((m,i)=>`<span class="chip ${S.cat==i?'on':''}" data-a="cat" data-v="${i}">${m[0]} ${m[1]}</span>`).join('')}</div>`;
 const m=MENU[S.cat];h+=`<h2>${m[1]}</h2>`;
 m[2].forEach(([id,nm,d,p])=>{const q=S.cart[id]||0;h+=`<div class="dish"><div class="t"><div class="n">${esc(nm)}</div><div class="mu">${esc(d)}</div><div class="pr">${R(p)}</div><button class="chip" style="margin-top:6px;padding:4px 10px;font-size:.85rem" data-a="jt" data-id="${id}">👥 Em conjunto</button></div><div class="ph${FOTOS[id]?'':' nf'}">${FOTOS[id]?ph(id,nm):'<span title="Foto em breve">📷</span>'}${q?`<div class="qs"><button data-a="q" data-id="${id}" data-d="-1">−</button>${q}<button data-a="q" data-id="${id}" data-d="1">+</button></div>`:`<button class="add" data-a="q" data-id="${id}" data-d="1">+</button>`}</div></div>`});
 if(n)h+=`<div class="bar"><button class="p" data-a="sheet"><span>🛍️ Ver sacola (${n})</span><span>${R(tot(S.cart))}</span></button></div>`;
 if(S.saved&&!n)h+='<p class="ok" style="padding:12px">✓ Pedido enviado.</p>';
 if(S.sheet)h+=sheet();if(S.jd)h+=jmodal();return h;
}
function sheet(){
 let h=`<div class="sheet"><div><div class="row"><h2 style="margin:0">Sua sacola</h2><button data-a="close">Fechar</button></div>`;
 Object.entries(S.cart).forEach(([id,q0])=>{const q=q0-S.shared.filter(j=>j.id==id).length;if(q<=0)return;h+=`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span>${esc(IT[id].n)}<br><span class="mu">${R(IT[id].p)}</span></span><span>${q}x <button data-a="q" data-id="${id}" data-d="-1">−</button> <button data-a="q" data-id="${id}" data-d="1">+</button></span></div>`});
 S.shared.forEach((j,i)=>{h+=`<div class="box" style="margin:8px 0"><div class="row"><b>👥 ${esc(IT[j.id].n)}</b><button data-a="jrm" data-i="${i}">Remover</button></div><div class="mu">Titular: <b>${esc(j.members[j.holder])}</b> · Com: ${esc(j.members.join(', '))}</div><div class="mu">${R(IT[j.id].p)} ÷ ${j.members.length} = ${R(IT[j.id].p/j.members.length)} por pessoa</div></div>`});h+=`<div class="row" style="margin:14px 0"><b>Almoço em grupo?</b><button class="chip ${S.grp?'on':''}" data-a="grp">${S.grp?'Sim':'Não'}</button></div>`;
 if(S.grp){h+=`<input data-f="title" value="${esc(S.title)}" placeholder="Nome do grupo (ex.: Família Silva)"><b>Integrantes</b>`;S.members.forEach((m,i)=>{h+=`<input data-f="mem" data-i="${i}" value="${esc(m)}" placeholder="Nome do integrante ${i+1}">`});h+='<button data-a="mem">+ Adicionar integrante</button>'}
 h+=`<textarea rows="2" data-f="note" placeholder="Observações (sem cebola, alergias…)">${esc(S.note)}</textarea><p class="row"><b>Total</b><b>${R(tot(S.cart))}</b></p><p class="err">${esc(S.err)}</p><button class="p" style="width:100%" data-a="send">${S.saved?'Atualizar pedido':'Enviar pedido'}</button></div></div>`;return h;
}
function jmodal(){const j=S.jd;return `<div class="sheet" style="z-index:30"><div><div class="row"><h2 style="margin:0">Prato em conjunto</h2><button data-a="jx">Cancelar</button></div><p><b>${esc(IT[j.id].n)}</b> · ${R(IT[j.id].p)}</p><p class="mu">Quem vai dividir este prato? Marque o titular, a pessoa responsável por ele.</p>${j.members.map((m,i)=>`<div class="row"><input data-f="jm" data-i="${i}" value="${esc(m)}" placeholder="Nome da pessoa ${i+1}"><label style="white-space:nowrap"><input type="radio" name="ht" style="width:auto" data-a="jh" data-i="${i}" ${j.holder==i?'checked':''}> Titular</label></div>`).join('')}<button data-a="jadd">+ Adicionar pessoa</button><p class="err">${esc(S.err)}</p><button class="p" style="width:100%" data-a="jok">Adicionar à sacola</button></div></div>`}
const tt=x=>x.title||x.name;
function summary(){const t={};S.orders.forEach(x=>Object.entries(x.items||{}).forEach(([i,q])=>t[i]=(t[i]||0)+q));
 let s=`PEDIDO DE ALMOÇO — ${S.orders.reduce((a,x)=>a+heads(x),0)} pessoas\n\nTOTAL POR ITEM\n`;
 Object.entries(t).forEach(([i,q])=>s+=`${q}x ${IT[i]?IT[i].n:i}\n`);s+='\nPOR PEDIDO\n';
 S.orders.forEach(x=>{s+=`\n${tt(x)}${x.mode=='grp'?' (grupo: '+(x.members||[]).filter(m=>m.trim()).join(', ')+')':''}\n`+Object.entries(x.items||{}).map(([i,q])=>` - ${q}x ${IT[i]?IT[i].n:i}\n`).join('')+(x.shared||[]).map(j=>` - EM CONJUNTO: ${IT[j.id].n} (titular: ${j.members[j.holder]}; com ${j.members.join(', ')})`+String.fromCharCode(10)).join('')+(x.note?` Obs: ${x.note}\n`:'')});
 return s+`\nTOTAL ESTIMADO: ${R(S.orders.reduce((a,x)=>a+tot(x.items),0))}`}
function admin(){
 const T=S.orders.reduce((a,x)=>a+tot(x.items),0);
 let h=`<div class="box"><b>${S.orders.length}</b> pedidos · <b>${S.orders.reduce((a,x)=>a+heads(x),0)}</b> pessoas · <b>${R(T)}</b></div><div class="box"><b>Resumo para o restaurante</b><pre id="sum">${esc(summary())}</pre><button class="p" data-a="copy">Copiar resumo</button> <span id="cp" class="ok"></span></div>`;
 S.orders.forEach(x=>{h+=`<div class="box"><div class="row"><b>${esc(tt(x))}${x.mode=='grp'?' · grupo de '+heads(x):''}</b><span>${R(tot(x.items))}</span></div>${x.mode=='grp'?`<div class="mu">Integrantes: ${esc((x.members||[]).filter(m=>m.trim()).join(', '))}</div>`:''}<div class="mu">${Object.entries(x.items||{}).map(([i,q])=>q+'x '+esc(IT[i]?IT[i].n:i)).join('; ')}</div>${(x.shared||[]).map(j=>`<div class="mu">👥 ${esc(IT[j.id].n)} — titular: <b>${esc(j.members[j.holder])}</b> · com ${esc(j.members.join(', '))}</div>`).join('')}${x.note?`<div class="mu">Obs: ${esc(x.note)}</div>`:''}<button data-a="del" data-id="${x.id}">Excluir</button></div>`});
 return h;
}
async function loadMine(){const s=await db.collection('orders').doc(S.sess.slug).get();if(s.exists){const d=s.data();S.cart=d.items||{};S.grp=d.mode=='grp';S.title=d.title||'';S.members=(d.members&&d.members.length)?d.members:[''];S.note=d.note||'';S.shared=d.shared||[];S.saved=true}}
function watch(){db.collection('orders').onSnapshot(s=>{S.orders=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.sess&&S.sess.role=='a'&&!document.activeElement.closest('input,textarea'))render()},()=>{})}
$.addEventListener('input',e=>{const d=e.target.dataset,f=d.f;if(f=='title')S.title=e.target.value;else if(f=='note')S.note=e.target.value;else if(f=='mem')S.members[d.i]=e.target.value;else if(f=='jm')S.jd.members[d.i]=e.target.value});
$.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a=='tab'){S.tab=d.v;S.err=''}
 else if(a=='cat'){S.cat=+d.v;scrollTo(0,0)}
 else if(a=='q'){if(+d.d<0&&(S.cart[d.id]||0)<=S.shared.filter(j=>j.id==d.id).length)return;S.cart[d.id]=(S.cart[d.id]||0)+ +d.d;if(S.cart[d.id]<=0)delete S.cart[d.id];if(!cnt(S.cart))S.sheet=false}
 else if(a=='sheet'){S.sheet=true;S.err=''}else if(a=='close')S.sheet=false;
 else if(a=='jt'){S.jd={id:d.id,members:['',''],holder:0};S.err=''}
 else if(a=='jx')S.jd=null;
 else if(a=='jadd')S.jd.members.push('');
 else if(a=='jh')S.jd.holder=+d.i;
 else if(a=='jok'){const j=S.jd,hn=(j.members[j.holder]||'').trim(),ls=j.members.map(m=>m.trim()).filter(Boolean);if(ls.length<2){S.err='Informe ao menos 2 pessoas.';render();return}if(!hn){S.err='O titular precisa ter nome.';render();return}S.shared.push({id:j.id,members:ls,holder:ls.indexOf(hn)});S.cart[j.id]=(S.cart[j.id]||0)+1;S.jd=null;S.err=''}
 else if(a=='jrm'){const j=S.shared.splice(+d.i,1)[0];S.cart[j.id]--;if(S.cart[j.id]<=0)delete S.cart[j.id];if(!cnt(S.cart))S.sheet=false}
 else if(a=='grp')S.grp=!S.grp;else if(a=='mem')S.members.push('');
 else if(a=='out'){S.sess=null;S.cart={};S.shared=[];S.saved=false;try{sessionStorage.removeItem('s')}catch(x){}}
 else if(a=='login'){S.err='';const pw=document.getElementById('pw').value;
  if(pw.length<4){S.err='A senha precisa ter ao menos 4 caracteres.';render();return}
  try{if(S.tab=='p'){const name=document.getElementById('nm').value.trim(),sl=slug(name);if(!sl){S.err='Digite seu nome.';render();return}
    const r=db.collection('accounts').doc(sl),s=await r.get();
    if(s.exists){if(await sha(s.data().salt+pw)!=s.data().hash){S.err='Senha incorreta.';render();return}}else{const salt=Math.random().toString(36).slice(2);await r.set({name,salt,hash:await sha(salt+pw)})}
    S.sess={role:'p',slug:sl,name};await loadMine()}
   else{if(!isOwner){S.err='Só o dono do app pode entrar como administrador.';render();return}
    const r=db.doc('config/admin'),s=await r.get();
    if(s.exists){if(await sha(s.data().salt+pw)!=s.data().hash){S.err='Senha incorreta.';render();return}}else{const salt=Math.random().toString(36).slice(2);await r.set({salt,hash:await sha(salt+pw)})}
    S.sess={role:'a'};watch()}
   save()}catch(x){S.err='Erro ao entrar. Verifique sua permissão de acesso.'}}
 else if(a=='send'){const ms=S.members.filter(m=>m.trim());
  if(S.grp&&(!S.title.trim()||!ms.length)){S.err='Informe o nome do grupo e ao menos um integrante.';render();return}
  try{await db.collection('orders').doc(S.sess.slug).set({name:S.sess.name,mode:S.grp?'grp':'ind',title:S.grp?S.title.trim():'',members:S.grp?ms:[],items:S.cart,shared:S.shared,note:S.note,at:Date.now()});S.saved=true;S.sheet=false;S.err=''}catch(x){S.err='Não foi possível enviar. Tente de novo.'}}
 else if(a=='del'){if(confirm('Excluir este pedido?'))await db.collection('orders').doc(d.id).delete().catch(()=>{});return}
 else if(a=='copy'){const t=summary(),c=document.getElementById('cp');try{await navigator.clipboard.writeText(t);c.textContent='Copiado!'}catch(x){const r=document.createRange();r.selectNodeContents(document.getElementById('sum'));getSelection().removeAllRanges();getSelection().addRange(r);c.textContent='Selecionado: copie com Ctrl+C'}return}
 render();
});
(async()=>{try{user=await claude.use('user');db=await claude.use('db');if(db&&user){isOwner=user.isOwner();
 let s=null;try{s=JSON.parse(sessionStorage.getItem('s'))}catch(e){}
 if(s&&s.role=='p'){S.sess=s;await loadMine()}else if(s&&s.role=='a'&&isOwner){S.sess=s;watch()}}}catch(e){}render()})();
